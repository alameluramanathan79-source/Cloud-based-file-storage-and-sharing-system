<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Admin</title><link rel="stylesheet" href="/css/style.css"></head><body><header><b>Admin Dashboard</b><a href="/dashboard">Dashboard</a></header><main><div class="card"><h2>Users</h2><table><tr><th>ID</th><th>Username</th><th>Role</th></tr><tr th:each="u:${users}"><td th:text="${u.id}"></td><td th:text="${u.username}"></td><td th:text="${u.role}"></td></tr></table></div><div class="card"><h2>File Metadata</h2><table><tr><th>File</th><th>Owner</th><th>Size</th></tr><tr th:each="f:${files}"><td th:text="${f.originalName}"></td><td th:text="${f.owner.username}"></td><td th:text="${f.size}"></td></tr></table></div></main></body></html>

<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Dashboard</title><link rel="stylesheet" href="/css/style.css"></head><body><header><b>Cloud File Storage</b><span>Welcome, <strong th:text="${username}"></strong> | <a href="/admin">Admin</a> <form class="inline" method="post" action="/logout"><button class="dark">Logout</button></form></span></header><main><div class="card"><h2>Upload File</h2><p>Files are AES-256-GCM encrypted before storage.</p><div class="ok" th:if="${param.uploaded}">Uploaded successfully.</div><div class="ok" th:if="${param.deleted}">Deleted successfully.</div><div class="err" th:if="${error}" th:text="${error}"></div><form method="post" action="/files/upload" enctype="multipart/form-data"><input type="file" name="file" required><button>Upload & Encrypt</button></form></div><div class="card"><h2>My Files</h2><p th:if="${#lists.isEmpty(files)}">No files yet.</p><table th:if="${!#lists.isEmpty(files)}"><tr><th>Name</th><th>Type</th><th>Size</th><th>Date</th><th>Action</th></tr><tr th:each="f:${files}"><td th:text="${f.originalName}"></td><td th:text="${f.contentType}"></td><td th:text="${f.size}"></td><td th:text="${f.uploadedAt}"></td><td><a th:href="@{'/files/download/'+${f.id}}">Download</a> <form class="inline" method="post" th:action="@{'/files/delete/'+${f.id}}"><button class="red">Delete</button></form></td></tr></table></div></main></body></html>
